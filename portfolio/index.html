<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio – Interactive Canvas</title>
<meta name="description" content="An interactive portfolio on an infinite canvas: projects, skills, experience, education, achievements and contact.">
<meta property="og:title" content="Portfolio – Interactive Canvas">
<meta property="og:description" content="Explore projects, skills, experience and more on an infinite canvas.">
<meta property="og:type" content="website">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body class="intro">
<a class="skip-link" href="#panel">Skip to content panel</a>

<header class="topbar">
  <h1 id="brand">Portfolio</h1>
  <div class="d-flex gap-2">
    <button class="btn-ui" id="btnSearch" aria-label="Search portfolio (Ctrl+K)">Search <kbd>Ctrl K</kbd></button>
    <button class="btn-ui" id="btnConn" aria-pressed="false">Show connections</button>
    <div class="menu-wrap">
      <button class="btn-ui" id="btnMenu" aria-expanded="false" aria-controls="menu">Menu</button>
      <nav id="menu" aria-label="Sections" hidden></nav>
    </div>
  </div>
</header>

<main id="stage" aria-label="Interactive portfolio canvas">
  <canvas id="stars" aria-hidden="true"></canvas>
  <div id="world">
    <div id="mid"><svg id="lines" width="1" height="1" aria-hidden="true"></svg></div>
    <div id="fg"></div>
  </div>
</main>

<div id="mlist" aria-label="Portfolio sections"></div>

<div class="controls" role="group" aria-label="Canvas controls">
  <button class="btn-ui sq" id="zIn" aria-label="Zoom in">+</button>
  <button class="btn-ui sq" id="zOut" aria-label="Zoom out">−</button>
  <button class="btn-ui" id="btnReset">Reset view</button>
  <button class="btn-ui" id="btnCenter">Center on me</button>
</div>
<p class="hint" id="hint">Drag to explore · scroll to zoom</p>
<div id="minimap" aria-hidden="true"></div>
<button class="btn-ui" id="btnMap">Map</button>
<nav id="bottomnav" aria-label="Quick navigation"></nav>
<button class="btn-ui" id="btnSkip">Skip intro</button>
<div id="toast" role="status" aria-live="polite"></div>

<aside id="panel" role="dialog" aria-modal="false" aria-labelledby="ptitle" tabindex="-1" hidden>
  <button class="btn-ui close" id="pclose" aria-label="Close panel">Close</button>
  <div id="pbody"></div>
</aside>

<div id="palette" role="dialog" aria-modal="true" aria-label="Search my portfolio" hidden>
  <div class="pal">
    <input id="q" type="text" placeholder="Search my portfolio or run a command" aria-label="Search" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="res">
    <ul id="res" role="listbox"></ul>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
